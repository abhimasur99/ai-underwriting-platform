# What the intake chat must collect before a deal is READY. Completeness is decided by code, never by a model.
required_documents:
  - {type: deal_summary,       label: "Deal summary and pro forma", accepted: [md, txt, pdf, docx]}
  - {type: purchase_contract,  label: "Purchase contract",          accepted: [md, txt, pdf, docx]}
  - {type: rent_roll,          label: "Rent roll",                  accepted: [csv, xlsx, pdf]}
  - {type: t12,                label: "T-12 operating statement",   accepted: [csv, xlsx, pdf]}
  - {type: renovation_budget,  label: "Renovation budget",          accepted: [csv, xlsx, pdf]}

optional_documents: [sponsor_materials, appraisal, photos, insurance]

required_facts:
  - property_address
  - asset_type
  - unit_count
  - loan_amount_requested
  - purchase_price
  - renovation_budget
  - sponsor_name

upload_limits:
  max_file_mb: 25
  allowed_extensions: [csv, xlsx, pdf, docx, md, txt, jpg, png]

# Cheap deterministic classification at upload time (filename, then columns, then the document's first
# lines). If every hint fails, or two disagree, the chat asks the person to confirm the type.
classification:
  filename_hints:
    rent_roll: [rent_roll, rentroll, rent-roll]
    t12: [t12, t-12, trailing, operating]
    renovation_budget: [reno, renovation, budget]
    purchase_contract: [contract, psa, purchase]
    deal_summary: [summary, package, offering, pro_forma]
  # first lines of a PDF, Word or text document (used when the filename says nothing)
  content_hints:
    deal_summary: ["deal summary", "sources and uses", "loan request"]
    purchase_contract: ["contract of sale", "purchase and sale", "purchase contract"]
    rent_roll: ["rent roll", "tenant roster"]
    t12: ["t-12", "t12", "trailing 12", "trailing twelve", "operating statement"]
    renovation_budget: ["renovation budget", "construction budget", "rehab budget", "capex budget"]
  header_hints:
    rent_roll: [unit, tenant, lease_start, monthly_rent]
    t12: [line_item, category, total]
    renovation_budget: [line_item, amount]
