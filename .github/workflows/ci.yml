name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Fixtures regenerate with no diff
        run: |
          python scripts/generate_sample_deals.py
          python scripts/generate_cached_fixtures.py
          git diff --exit-code data/deals docs/deals-catalog.md
      - name: OpenAPI spec is up to date
        run: |
          python scripts/export_openapi.py
          git diff --exit-code frontend/openapi.json

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run build
