[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge-loan-platform"
version = "0.1.0"
description = "MVP demo: multi-agent bridge loan screening layer (sample data only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "anthropic",
    "openpyxl",
    "reportlab",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
bridge = ["agents/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Point at backend/ directly so tests do not depend on the editable-install .pth file
# (macOS can flag it hidden, and Python then skips it).
pythonpath = ["backend", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Handed-off fixture generator; long lines are fine, and it is the source of expected.json.
"scripts/generate_sample_deals.py" = ["E501"]
